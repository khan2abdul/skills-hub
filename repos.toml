# Skill sources.
#
# The 11 harvested repos are cloned INSIDE the hub, at repos/, by
# tools/clone_repos.py. That keeps the hub self-contained: one clone of this
# repo plus one command reproduces every source, with no external folder.
#
# Every `path` is RELATIVE to sources_root. Nothing here is machine-specific.
#
# sources_root resolution (first wins):
#   1. $env:SKILLS_HUB_SOURCES
#   2. sources_root below (relative to the hub, or absolute)
#   3. <hub>/../setupskills   (legacy external layout, kept so an existing
#                              checkout resolves without re-downloading)
#
# status = "cloned"    -> cloned into repos/, harvest scans it
# status = "reference" -> catalogued only; not cloned, harvest skips it
#
# Run tools/clone_repos.py to clone or refresh, then tools/harvest.py.

sources_root = "repos"

# --- Cloned and harvested -------------------------------------------------

[[repo]]
name = "addy-agent-skills"
