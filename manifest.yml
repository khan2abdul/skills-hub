[[skill]]
name = "discuss-on-new-idea"
status = "merged"
chosen = ""
composed = ["idea-refine", "brainstorming"]
candidates = ["idea-refine", "brainstorming", "grilling", "junior-to-senior"]
rationale = "Sharpens a vague idea before any planning. Was idea-refine alone (craft 8.7, GATES 6/10): its Process section explains three phases and never says what makes an idea ready to leave a phase or when to stop diverging. Added brainstorming's Play It Back and Red Flags, which are exactly those gates - what an idea must survive before it becomes a plan. grilling is stress-test only. brainstorming's full body was rejected as a replacement base: it is a session protocol (visual companion, browser handoff) rather than an ideation method."

[[skill]]
name = "interview-me-properly"
status = "merged"
chosen = ""
candidates = ["interview-me", "grill-me", "grill-with-docs", "grilling"]
rationale = "One-question-at-a-time interrogation until ambiguity is 0%. Four repos ship a version; addyosmani's is the most forcing."

[[skill]]
name = "explore-this-repo"
status = "merged"
chosen = ""
composed = ["caveman-explore", "cavecrew"]
candidates = ["caveman-explore", "caveman-discover", "cavecrew"]
rationale = "Read-only orientation across a cold repo, returning path:line only; keeps reads out of main context. Was caveman-explore shipped verbatim, which carried two defects: host frontmatter (tools: Read, Glob, Grep and model: haiku pin one vendor's tool names and a model alias - portability 7/10, and it also failed the minimum size band at 1,966 chars), and a body with zero headings and no numbered steps. Composing fixes the frontmatter by construction, since compose.py emits only name and description. cavecrew adds the output contract the explorer never specified: the exact citation shape a caller can rely on, backticked symbols, and the terminal No match. case. Its full investigator/builder/reviewer triage was rejected as a different job."

[[skill]]
name = "research-this-topic"
status = "merged"
chosen = ""
composed = ["source-driven-development", "research"]
candidates = ["research", "source-driven-development"]
rationale = "Was `research` alone (816 chars, no headings, zero verification language): a stub that says 'go research' with no procedure. `source-driven-development` does the same job with a 4-step process, a citations rule and a rationalisations section. Composed: its whole body as the procedure, plus research's closing section on where the findings are written - the one thing the stub did better."

