[[skill]]
name = "write-the-spec"
status = "merged"
chosen = ""
composed = ["spec-driven-development", "to-spec"]
candidates = ["to-spec", "spec-driven-development", "write-milestone-brief", "loop-factory", "spec"]
rationale = "Was `to-spec` alone (3,118 chars, craft 8.4) and it carried disable-model-invocation: true, so only a typed /write-the-spec reached it. `spec` is the largest candidate (56,410 chars) but scores craft 6.9, not 10: 76 headings of host-specific preamble and portability 1/10 - picking on size alone would have chosen the worst source. Composed: spec-driven-development's gated workflow (craft 9.6) as the procedure, plus to-spec's distinct job of synthesising a spec straight from the current conversation."

[[skill]]
name = "break-into-tasks"
status = "merged"
chosen = ""
candidates = ["decompose-into-slices", "to-tickets", "planning-and-task-breakdown", "wayfinder"]
rationale = "Vertical tracer-bullet slices with declared blocking edges. decompose-into-slices is the sharpest; planning-and-task-breakdown produces no ticket file."

[[skill]]
name = "review-the-plan"
status = "merged"
chosen = ""
composed = ["junior-to-senior", "plan-eng-review"]
candidates = ["plan-eng-review", "junior-to-senior", "office-hours"]
rationale = "Was `plan-eng-review` alone (51,484c, craft 6.9, portability 1/10, 14 uninstalled helpers); ~95% of it is gstack scaffolding - preamble, plan-mode notes, AskUserQuestion format, telemetry, status footer, cache refresh. `junior-to-senior` scores 10/10 on every dimension (9,194c): a five-phase adversarial review that treats the plan as junior work and builds a senior reviewer to attack it. Same job at one fifth the context. Kept only two plan-eng-review sections with content it lacks: the scope challenge and how great eng managers think."

[[skill]]
name = "write-the-domain-glossary"
status = "merged"
candidates = ["domain-modeling", "grill-with-docs", "codebase-design"]
chosen = ""
composed = ["domain-modeling", "documentation-and-adrs", "spec-driven-development"]
rationale = "Canonical terms in GLOSSARY.md plus ADRs. Was domain-modeling alone (craft 8.9, GATES 4/10, the weakest gate score in the hub): it says how to build a glossary and an ADR and never states a rule that stops you publishing a bad one. Added documentation-and-adrs Prose Review, the checks to run on the written result. codebase-design rejected: different vocabulary, 2 gates, overlaps the base."

[[skill]]
name = "design-the-interface"
status = "merged"
chosen = ""
composed = ["codebase-design", "design-an-interface", "api-and-interface-design", "documentation-and-adrs", "spec-driven-development"]
candidates = ["design-an-interface", "api-and-interface-design", "api-design", "codebase-design"]
rationale = "Produce several designs, compare them, then gate the winner. Was design-an-interface + codebase-design (8,886c, craft 9.3, GATES 6/10): it generates designs and compares them and then stops - nothing says when a design is finished, and codebase-design's own sections score 0-2 gates each so it cannot supply that. Added api-and-interface-design's Verification checklist (typed schemas, one error format, validation at boundaries only, additive fields, idempotency) and its Red Flags. That is what turns 'here are three designs' into 'here is the one that passes'. Its 3,070c worked example was rejected: teaches one pattern rather than gating a design."

