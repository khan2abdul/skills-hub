# Canonical skill manifest.
#
# ONE entry per capability. `name` is what the agent sees and what users say.
# `candidates` lists every upstream skill that covers this capability, best first.
# `chosen` is the upstream skill whose body is vendored as the base. Empty until merged.
#
# Status: proposed = awaits review | merged = body vendored in skills/<name>/
# Dedupe rule: merge only where the capability is genuinely the same job.
#            Distinct jobs keep distinct names even if they touch the same phase.

