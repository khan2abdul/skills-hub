rationale = "Was surgical-patch alone (664c, craft 6.2, size 2/10): a six-bullet summary of a discipline, not a procedure. debug-this-code already owns the full red-green procedure, so a second debug skill would duplicate it. The stub lacked two things: change-discipline (what counts as in-scope, what must not be touched) and a way to make done verifiable. karpathy-guidelines sections 3-4 supply the first; systematic-debugging's four-phase Quick Reference and Phase 1 root-cause investigation supply the second. Phase 4 of systematic-debugging was rejected despite being the best fit on paper: it instructs the agent to use superpowers:test-driven-development and superpowers:verification-before-completion, neither of which this hub ships - the same defect as the dead gstack hooks. 5,732c, in band."

